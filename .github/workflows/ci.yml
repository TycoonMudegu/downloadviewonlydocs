name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: docker build -t drive-download-helper .
      - name: Smoke test the container and its browser
        run: |
          docker run -d --name drive-pdf -p 8080:8080 drive-download-helper
          cleanup() {
            docker logs drive-pdf
            docker rm -f drive-pdf
          }
          trap cleanup EXIT
          curl --retry 15 --retry-delay 1 --retry-all-errors --retry-max-time 30 --max-time 5 --fail --silent --show-error http://127.0.0.1:8080/healthz
          docker exec drive-pdf node --input-type=module -e '
            import assert from "node:assert/strict";
            import { chromium } from "playwright";
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              const response = await page.goto("http://127.0.0.1:8080/", { waitUntil: "networkidle" });
              assert.equal(response.status(), 200);
              await page.evaluate(() => document.fonts.ready);
              assert.ok(["morning", "midday", "afternoon"].includes(await page.locator("html").getAttribute("data-theme")));
              assert.equal(await page.locator("#submit-button").isEnabled(), true);
              console.log("Container and Chromium are healthy.");
            } finally { await browser.close(); }
          '
